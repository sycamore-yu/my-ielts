name: Build and Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install -g pnpm@8.6.0 && pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm exec vitest run
      - name: Run Build
        run: pnpm run build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages
          folder: dist
